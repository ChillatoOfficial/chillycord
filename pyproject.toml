[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chillycord"
description = "A Python wrapper for the Discord API"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "ChillatoOfficial" }, { name = "Rapptz (discord.py upstream)" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dynamic = ["version", "dependencies"]

[project.urls]
Documentation = "https://github.com/Rapptz/discord.py"
"Issue tracker" = "https://github.com/ChillatoOfficial/chillycord/issues"

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }

[project.optional-dependencies]
voice = [
    "PyNaCl>=1.6.0,<1.7",
    "davey>=0.1.0",
    "audioop-lts; python_version>='3.13'",
]
speed = [
    "orjson>=3.5.4",
    "aiodns>=1.1; sys_platform != 'win32'",
    "Brotli",
    "cchardet==2.1.7; python_version < '3.10'",
    "zstandard>=0.23.0; python_version <= '3.13'"
]
test = [
    "coverage[toml]",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "typing-extensions>=4.3,<5",
    "tzdata; sys_platform == 'win32'",
]
dev = [
    "ruff==0.12",
    "typing_extensions>=4.3,<5",
]

[tool.setuptools]
packages = [
    "chillycord",
    "chillycord.types",
    "chillycord.ui",
    "chillycord.webhook",
    "chillycord.app_commands",
    "chillycord.ext.commands",
    "chillycord.ext.tasks",
]
include-package-data = true

[tool.ruff]
line-length = 125
extend-exclude = ["tests"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
line-ending = "lf"
quote-style = "single"

[tool.coverage.run]
omit = [
    "chillycord/__main__.py",
    "chillycord/types/*",
    "*/_types.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@overload",
]

[tool.pyright]
include = [
    "chillycord",
    "chillycord/app_commands",
    "chillycord/types",
    "chillycord/ui",
    "chillycord/ext",
    "chillycord/ext/commands",
    "chillycord/ext/tasks",
]
exclude = [
    "**/__pycache__",
    "build",
    "dist",
]
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedImport = "error"
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "strict"
